          <div class="l-main__body">
            <h1 class="l-main__title">Button</h1>
            <div class="l-main__content">
              <h3 class="section-title">Variants</h3>
              <div class="form-group--grid">
                <button class="btn btn--primary" type="button">Send form</button>
                <button class="btn btn--secondary" type="button">Send form</button>
              </div>
              <h3 class="section-title">Outline</h3>
              <div class="form-group--grid">
                <button class="btn btn--outline-primary" type="button">Send form</button>
                <button class="btn btn--outline-secondary" type="button">Send form</button>
              </div>
              <h3 class="section-title">Sizes</h3>
              <div class="form-group--grid">
                <button class="btn btn--primary btn--lg" type="button">Large button</button>
                <button class="btn btn--primary" type="button">Generic button</button>
                <button class="btn btn--primary btn--sm" type="button">Small button</button>
              </div>
              <h3 class="section-title">Disabled</h3>
              <div class="form-group--grid">
                <button class="btn btn--primary" type="button" disabled>Save</button>
                <button class="btn btn--secondary" type="button" disabled>Save</button>
              </div>
              <h3 class="section-title">Shadow button</h3>
              <div class="form-group--grid">
                <button class="btn btn--primary btn--primary-shadow" type="button">Button with shadow</button>
                <button class="btn btn--secondary btn--secondary-shadow" type="button">Button with shadow</button>
              </div>
              <h3 class="section-title">Custom button</h3>
              <div class="form-group--grid">
                <button class="btn btn--custom" type="button">Custom button</button>
                <button class="btn btn--tertiary" type="button">Tertiary button</button>
              </div>
              <h3 class="section-title">Custom outline button</h3>
              <div class="form-group--grid">
                <button class="btn btn--dark" type="button">This is the button text</button>
                <button class="btn btn--outline-dark" type="button">This is the button text</button>
              </div>
              <h3 class="section-title">Clear Button</h3>
              <div class="form-group--grid">
                <button class="clear-btn" type="button">Remove button styles</button>
              </div>
              <h3 class="section-title">With Icons</h3>
              <div class="form-group--grid">
                <button class="btn btn--secondary btn--sm" type="button">
                  <svg class="btn__icon" height="24px" viewBox="0 0 24 24" width="24px">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" style="fill: currentColor;"></path>
                  </svg>Copy button
                </button>
                <button class="btn btn--secondary" type="button">
                  <svg class="btn__icon btn__icon--sm" height="24px" viewBox="0 0 24 24" width="24px">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" style="fill: currentColor;"></path>
                  </svg>Copy button
                </button>
                <button class="btn btn--secondary btn--lg" type="button">Copy button
                  <svg class="btn__icon" height="24px" viewBox="0 0 24 24" width="24px">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" style="fill: currentColor;"></path>
                  </svg>
                </button>
              </div>
              <h3 class="section-title">Icon Button</h3>
              <div class="form-group--grid">
                <button class="btn btn--secondary btn--icon btn--sm" type="button" aria-label="Copy Text">
                  <svg class="btn__icon" height="24px" viewBox="0 0 24 24" width="24px">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" style="fill: currentColor;"></path>
                  </svg>
                </button>
                <button class="btn btn--secondary btn--icon" type="button" aria-label="Copy Text">
                  <svg class="btn__icon" height="24px" viewBox="0 0 24 24" width="24px">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" style="fill: currentColor;"></path>

                </button>
                <button class="btn btn--secondary btn--icon btn--lg" type="button" aria-label="Copy Text">

                  </svg>
                </button>
              </div>
              <h3 class="section-title">Icon Size Compare</h3>
              <div class="form-group--height-test">

                <button class="btn btn--secondary btn--icon btn--sm" type="button" aria-label="Copy Text">
                  <svg class="btn__icon" height="24px" viewBox="0 0 24 24" width="24px">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" style="fill: currentColor;"></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
