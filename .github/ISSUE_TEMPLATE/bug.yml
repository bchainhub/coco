name: Bug report
description: Report a reproducible problem with COCO
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve COCO. Please provide enough detail for us to reproduce the problem.

  - type: input
    id: coco-version
    attributes:
      label: COCO version
      description: Which version of COCO are you using?
      placeholder: 2.3.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
      description: Include the operating system and browser, with their versions.
      placeholder: macOS 15.6, Safari 18.6
    validations:
      required: true

  - type: textarea
    id: bug
    attributes:
      label: Problem
      description: Clearly describe what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: List the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Add ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: input
    id: hash
    attributes:
      label: Commit hash
      description: Provide the commit hash when testing an unreleased revision.
      placeholder: baf2aab0128f07262b564214ec70fc07befc6bb3

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add relevant markup, screenshots, or links to a minimal reproduction.
