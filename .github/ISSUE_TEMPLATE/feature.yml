name: Feature request
description: Suggest an improvement to COCO
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        Explain the use case and how the proposal fits a JavaScript-free CSS framework.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: Describe the solution you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe alternatives you've considered.

  - type: textarea
    id: implementation
    attributes:
      label: Implementation
      description: Describe a possible implementation and include example markup or CSS.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any relevant context, screenshots, or links.
