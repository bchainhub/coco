<!DOCTYPE html>
<html lang="en">
<head>
    <title>Input group label</title>
    <meta name="description" content="`.form-group-label` visually joins short text to a neighboring control. Use it
inside a stacked form group and provide an accessible label for the input.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="styleguide">
    <link rel="icon" type="image/svg+xml" href="./styleguide-assets/favicon/fullpage.svg">
    
    <meta name="theme-color" content="#43b649">
    <script type="module" src="./styleguide-assets/fullpage-Ck0nyq2C.js"></script>
    <link rel="stylesheet" type="text/css" href="../assets/coco.css">
</head>
<body>
    <label
	class="form-label"
	for="kss-price"
>
	Price
</label>
<div class="form-group form-group--stacked">
	<span
		class="form-group-label"
		aria-hidden="true"
	>
		€
	</span>
	<input
		class="form-control"
		id="kss-price"
		type="number"
		aria-label="Price in euros"
	>
</div>

    
</body>
</html>
